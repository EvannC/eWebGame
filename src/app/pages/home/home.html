<div class="flex flex-col items-center justify-center py-50 gap-10">

  <div class="flex flex-row font-bold text-4xl">
    <h2>Des jeux entre amis, sans limite !</h2>
  </div>
  <div class="flex flex-row gap-10">
  <button
  routerLink="/create"
  class="px-6 py-3 rounded-xl bg-violet-600 font-semibold hover:bg-violet-500 transition cursor-pointer">
  Créer une partie
</button>
<button
  routerLink="/join"
  class="px-6 py-3 rounded-xl border border-white/15 bg-white/5 font-semibold hover:bg-white/10 transition cursor-pointer">
  Rejoindre une partie
</button>
</div>
<div class="flex gap-10">
@for (element of gameModes; track element.title) {
   <app-game-mode-card
     [title]="element.title"
     [description]="element.description"
     (selected)="selectMode($event)"
   />
}
</div>
</div>
